name: OpenCEF landscape integration verification

on:
  push:
    branches:
      - opencef-integration-landscape
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK and NDK
        run: |
          sdkmanager "platform-tools" \
            "platforms;android-34" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "cmake;3.22.1" \
            "ndk;26.2.11394342"

      - name: Make Gradle wrapper executable
        run: |
          sed -i 's/\r$//' ./gradlew
          chmod +x ./gradlew

      - name: Run OpenCEF unit tests and compile Android instrumentation tests
        run: |
          ./gradlew --no-daemon --stacktrace \
            :core:test \
            :android:testDebugUnitTest \
            :host:testDebugUnitTest \
            :android:compileDebugAndroidTestKotlin

      - name: Assemble combined client debug APK (not published)
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
